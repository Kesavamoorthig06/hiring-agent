<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hiring Agent - settings</title>
<script>try{var t=localStorage.getItem("ha-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.box h1{font-size:30px;letter-spacing:-.04em;margin:0 0 6px}
.box p{color:var(--mute);margin:0 0 18px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.top{position:fixed;top:14px;right:14px}
.st{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:6px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.ok{background:var(--acc2)}.dot.bad{background:var(--bad)}.dot.mid{background:var(--warn)}
.msg{min-height:20px;font-size:14px;margin-top:12px}.msg.bad{color:var(--bad)}.msg.good{color:var(--acc)}
</style>
</head>
<body>
<button id="theme" class="icon-btn top" aria-label="Switch light or dark theme">
  <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="ic moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main class="box" id="gate">
  <h1>Passcode</h1>
  <p>Enter the passcode to continue.</p>
  <form id="gateForm" autocomplete="off">
    <input id="pass" type="password" autocomplete="off" placeholder="Passcode" required>
    <div class="row"><button class="btn primary" type="submit"><span>Enter</span></button></div>
    <div class="msg" id="gateMsg" role="alert"></div>
  </form>
</main>

<main class="box" id="panel" hidden>
  <h1>Claude on Bedrock</h1>
  <p>Paste the lab credentials. They stay in memory on the server and are never saved or shown again.</p>
  <div class="st"><i class="dot" id="dot"></i><span id="stTxt">Checking</span></div>
  <div class="st" id="stMeta" hidden></div>
  <form id="credForm" autocomplete="off">
    <label for="ak">Access key ID</label><input id="ak" type="password" autocomplete="off" required>
    <label for="sk">Secret access key</label><input id="sk" type="password" autocomplete="off" required>
    <label for="tk">Session token</label><input id="tk" type="password" autocomplete="off">
    <label for="rg">Region</label><input id="rg" type="text" placeholder="us-east-1" autocomplete="off" required>
    <label for="md">Model or inference profile ID</label><input id="md" type="text" placeholder="us.anthropic.claude-..." autocomplete="off" required>
    <div class="row">
      <button class="btn primary" type="submit"><span>Save credentials</span></button>
      <button class="btn" type="button" id="test"><span>Test with one call</span></button>
      <button class="btn ghost" type="button" id="clear"><span>Clear</span></button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  $("theme").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t; try { localStorage.setItem("ha-theme", t); } catch (e) {}
  });
  const api = async (path, body) => {
    const r = await fetch("/admin/api/" + path, { method: body === undefined ? "GET" : "POST", credentials: "same-origin",
      headers: body === undefined ? {} : { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, j };
  };
  const say = (t, kind) => { const m = $("msg"); m.textContent = t || ""; m.className = "msg " + (kind || ""); };
  const when = (iso) => iso ? new Date(iso).toLocaleString() : "";
  function paint(s) {
    const map = { unset: ["", "No credentials set"], untested: ["mid", "Saved, not tested yet"], ok: ["ok", "Working"], invalid: ["bad", "Rejected or expired"] };
    const [cls, txt] = map[s.state] || ["", s.state];
    $("dot").className = "dot " + cls; $("stTxt").textContent = txt + (s.reason ? " (" + s.reason + ")" : "");
    const meta = $("stMeta");
    if (s.set) { meta.hidden = false; meta.textContent = "Region " + s.region + " | set " + when(s.set_at); } else meta.hidden = true;
  }
  async function refresh() {
    const r = await api("status");
    if (r.status === 404) { $("panel").hidden = true; $("gate").hidden = false; return false; }
    $("gate").hidden = true; $("panel").hidden = false; paint(r.j); return true;
  }
  $("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("gateMsg").textContent = "";
    const r = await api("login", { passcode: $("pass").value });
    $("pass").value = "";
    if (!r.ok) { $("gateMsg").textContent = r.j.detail || "Could not sign in."; $("gateMsg").className = "msg bad"; return; }
    refresh();
  });
  $("credForm").addEventListener("submit", async (e) => {
    e.preventDefault(); say("Saving");
    const r = await api("creds", { access_key_id: $("ak").value, secret_access_key: $("sk").value, session_token: $("tk").value, region: $("rg").value, model_id: $("md").value });
    if (!r.ok) return say(r.j.detail || "Could not save.", "bad");
    ["ak", "sk", "tk"].forEach((k) => ($(k).value = ""));
    paint(r.j); say("Saved. Use Test to check them.", "good");
  });
  $("test").addEventListener("click", async () => {
    say("Calling Claude once");
    const r = await api("test", {});
    if (r.status === 404) return refresh();
    paint(r.j); say(r.j.message || "", r.j.ok ? "good" : "bad");
  });
  $("clear").addEventListener("click", async () => {
    const r = await api("clear", {}); if (r.status === 404) return refresh(); paint(r.j); say("Cleared.", "good");
  });
  refresh();
})();
</script>
</body>
</html>
